provider:
  name: ubicloud
data_sources:
  firewall:
    read:
      path: /project/{project_id}/location/{location}/firewall/{firewall_reference}
      method: GET
    schema:
      attributes:
        aliases:
          firewall_reference: name
      ignores:
        - private_subnets.firewalls
  firewall_rule:
    read:
      path: /project/{project_id}/location/{location}/firewall/{firewall_reference}/firewall-rule/{firewall_rule_id}
      method: GET
    schema:
      attributes:
        aliases:
          firewall_reference: firewall_name
          firewall_rule_id: id
  private_subnet:
    read:
      path: /project/{project_id}/location/{location}/private-subnet/{private_subnet_reference}
      method: GET
    schema:
      attributes:
        aliases:
          private_subnet_reference: name
  project:
    read:
      path: /project/{project_id}
      method: GET
    schema:
      attributes:
        aliases:
          project_id: id
  vm:
    read:
      path: /project/{project_id}/location/{location}/vm/{vm_reference}
      method: GET
    schema:
      attributes:
        aliases:
          vm_reference: name
  postgres:
    read:
      path: /project/{project_id}/location/{location}/postgres/{postgres_database_reference}
      method: GET
    schema:
      attributes:
        aliases:
          postgres_database_reference: name
          vm_size: size
resources:
  firewall:
    create:
      path: /project/{project_id}/location/{location}/firewall/{firewall_reference}
      method: POST
    read:
      path: /project/{project_id}/location/{location}/firewall/{firewall_reference}
      method: GET
    schema:
      attributes:
        aliases:
          firewall_reference: name
      ignores:
        - private_subnets.firewalls
  firewall_rule:
    create:
      path: /project/{project_id}/location/{location}/firewall/{firewall_reference}/firewall-rule
      method: POST
    read:
      path: /project/{project_id}/location/{location}/firewall/{firewall_reference}/firewall-rule/{firewall_rule_id}
      method: GET
    schema:
      attributes:
        aliases:
          firewall_reference: firewall_name
          firewall_rule_id: id
  vm:
    create:
      path: /project/{project_id}/location/{location}/vm/{vm_reference}
      method: POST
    read:
      path: /project/{project_id}/location/{location}/vm/{vm_reference}
      method: GET
    schema:
      attributes:
        aliases:
          vm_reference: name
      ignores:
        - ip4
        - ip6
        - state
        - storage_size_gb
  postgres:
    create:
      path: /project/{project_id}/location/{location}/postgres/{postgres_database_reference}
      method: POST
    read:
      path: /project/{project_id}/location/{location}/postgres/{postgres_database_reference}
      method: GET
    schema:
      attributes:
        aliases:
          postgres_database_reference: name
          vm_size: size
      ignores:
        - connection_string
        - earliest_restore_time
        - latest_restore_time
        - state
  private_subnet:
    create:
      path: /project/{project_id}/location/{location}/private-subnet/{private_subnet_reference}
      method: POST
    read:
      path: /project/{project_id}/location/{location}/private-subnet/{private_subnet_reference}
      method: GET
    schema:
      attributes:
        aliases:
          private_subnet_reference: name
  project:
    create:
      path: /project
      method: POST
    read:
      path: /project/{project_id}
      method: GET
    schema:
      attributes:
        aliases:
          project_id: id
