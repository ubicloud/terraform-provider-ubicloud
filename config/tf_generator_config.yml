provider:
  name: ubicloud
data_sources:
  firewall:
    read:
      path: /project/{project_id}/location/{location}/firewall/{firewall_reference}
      method: GET
    schema:
      attributes:
        aliases:
          firewall_reference: name
      ignores:
        - private_subnets
        - firewall_rules.protocol
        - firewall_rules.description
  firewall_rule:
    read:
      path: /project/{project_id}/location/{location}/firewall/{firewall_reference}/firewall-rule/{firewall_rule_id}
      method: GET
    schema:
      attributes:
        aliases:
          firewall_rule_id: id
  private_subnet:
    read:
      path: /project/{project_id}/location/{location}/private-subnet/{private_subnet_reference}
      method: GET
    schema:
      attributes:
        aliases:
          private_subnet_reference: name
  project:
    read:
      path: /project/{project_id}
      method: GET
    schema:
      attributes:
        aliases:
          project_id: id
  vm:
    read:
      path: /project/{project_id}/location/{location}/vm/{vm_reference}
      method: GET
    schema:
      attributes:
        aliases:
          vm_reference: name
      ignores:
        - boot_image
        - ip4_enabled
        - gpu
        - firewalls.firewall_rules.protocol
        - firewalls.firewall_rules.description
  postgres:
    read:
      path: /project/{project_id}/location/{location}/postgres/{postgres_database_reference}
      method: GET
    schema:
      attributes:
        aliases:
          postgres_database_reference: name
resources:
  firewall:
    create:
      path: /project/{project_id}/location/{location}/firewall/{firewall_reference}
      method: POST
    read:
      path: /project/{project_id}/location/{location}/firewall/{firewall_reference}
      method: GET
    schema:
      attributes:
        aliases:
          firewall_reference: name
      ignores:
        - private_subnets
  firewall_rule:
    create:
      path: /project/{project_id}/location/{location}/firewall/{firewall_reference}/firewall-rule
      method: POST
    read:
      path: /project/{project_id}/location/{location}/firewall/{firewall_reference}/firewall-rule/{firewall_rule_id}
      method: GET
    schema:
      attributes:
        aliases:
          firewall_rule_id: id
      ignores:
        - firewall_id
  vm:
    create:
      path: /project/{project_id}/location/{location}/vm/{vm_reference}
      method: POST
    read:
      path: /project/{project_id}/location/{location}/vm/{vm_reference}
      method: GET
    schema:
      attributes:
        aliases:
          vm_reference: name
      ignores:
        - ip4
        - ip6
        - state
        - storage_size_gb
        - firewalls
        - id
        - ip4_enabled
        - private_ipv4
        - private_ipv6
        - storage_size_gib
        - subnet
  postgres:
    create:
      path: /project/{project_id}/location/{location}/postgres/{postgres_database_reference}
      method: POST
    read:
      path: /project/{project_id}/location/{location}/postgres/{postgres_database_reference}
      method: GET
    schema:
      attributes:
        aliases:
          postgres_database_reference: name
  private_subnet:
    create:
      path: /project/{project_id}/location/{location}/private-subnet/{private_subnet_reference}
      method: POST
    read:
      path: /project/{project_id}/location/{location}/private-subnet/{private_subnet_reference}
      method: GET
    schema:
      attributes:
        aliases:
          private_subnet_reference: name
  project:
    create:
      path: /project
      method: POST
    read:
      path: /project/{project_id}
      method: GET
    schema:
      attributes:
        aliases:
          project_id: id
